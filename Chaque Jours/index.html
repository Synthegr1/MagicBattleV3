<html>
	<head>
		<title>Chaque Jours</title>
	</head>
	<body>
		<canvas id="canva" width="7920" height="100">Test</canvas>
		<button id="refresh" onclick="main()">Refresh</button>
		<script>

			let player_x = 0;
			let player_y = 0;

			myAudioElement = new Audio("piafs.mp3");
			myMainAudio = new Audio("main.ogg");

			var js_canva = document.getElementById("canva");
			js_canva.width = window.innerWidth;
			js_canva.height = window.innerHeight;

			console.log(window.innerHeight);

			var ctx = canva.getContext("2d");

			move(12);

			ctx.fillStyle = "#108C07";

			document.getElementById("refresh").addEventListener("click", () => {
				myAudioElement.play();
				myMainAudio.play();
				main();
			});

			document.addEventListener("keydown", logKey);

			function logKey(e) {
				console.log(e.code);
				let f;

				if(e.code == "ArrowUp"){
					player_y -= 20;
					f = 3;
				}else if(e.code == "ArrowDown"){
					player_y += 20;
					f = 0;
				}else if(e.code == "ArrowRight"){
					player_x += 20;
					f = 1;
				}else if(e.code == "ArrowLeft"){
					player_x -= 20;
					f = 4;
				} 

				move(f);

			}

			function random(max) {
  				return Math.floor(Math.random() * max);
			}

			function move(x){
				let colors = ["green", "#108C07", "#544021"];

				let b = 1;

				if(random(12) == 3){
					b = 0;
				}
				if(random(100) == 67){
					b = 2;
				}

				if(x == 0){
					ctx.fillStyle = colors[b];
					ctx.fillRect(player_x, player_y - 20, 20, 20);
				} else if(x == 1){
					ctx.fillStyle = colors[b];
					ctx.fillRect(player_x - 20, player_y, 20, 20);
				} else if(x == 3){
					ctx.fillStyle = colors[b];
					ctx.fillRect(player_x, player_y + 20, 20, 20);
				} else if(x == 4){
					ctx.fillStyle = colors[b];
					ctx.fillRect(player_x + 20, player_y, 20, 20);
				}

				ctx.fillStyle = "yellow";
				ctx.fillRect(player_x, player_y, 20, 20);
				
			}

			function get_sol(){
				let cerise = 0;
				let number = 0;
				let size = window.innerWidth;
				m = 35;
				//console.log(size);
				for(let f = 0; f < window.innerHeight; f += 40){
					for(let i = 0; i < size; i += 40){
						ctx.fillStyle = "#108C07";
						ctx.fillRect(i, f, 40, 40);
						//console.log(i);
					}
					let colors = ["#14920B", "#0B7A04"];
					let b = false;

					if(random(2) == 1 && number < m){
						ctx.fillStyle = colors[random(2)];
						ctx.fillRect(random(size), f, 20, 20)
						b = true;
						number += 1;
					} else {
						continue;
					}

					if(b && random(4) == 2 && number < m){
						ctx.fillStyle = "#0C6F05";
						ctx.fillRect(random(size), f, 20, 20)
						number += 1;
					} else {
						continue;
					}

					if(random(15) == 4){
						ctx.fillStyle = "grey";
						ctx.fillRect(random(size), f, 20, 20)
					}
					 else if(random(7) == 4){
						ctx.fillStyle = "#544021";
						ctx.fillRect(random(size), f, 20, 20)
					}
				}
			}

			function drawTree(p){
				let n = random(window.innerHeight);

				let cerise = 0;
				let f = 100;
				let x = n;

				for(let i = f + 40; i < 5 * 40 + 1; i += 40){
					ctx.fillStyle = "#034406";
					ctx.fillRect(i + p, x, 20, 20)
					i -= 20;
				}

				x += 15;

				for(let i = f + 20; i < 5.5 * 40 + 1; i += 40){
					if(random(12) == 3 && cerise < 3){
						ctx.fillStyle = "red";
						ctx.fillRect(i + p, x, 20, 20)
						i -= 20;
						cerise += 1;
					} else {
						ctx.fillStyle = "#034406";
						ctx.fillRect(i + p, x, 20, 20)
						i -= 20;
					}
				}

				x += 15;

				for(let o = 0; o < 4; o++){
					for(let i = f; i < 6 * 40 + 1; i += 40){
						if(random(12) == 3 && cerise < 3){
							ctx.fillStyle = "red";
							ctx.fillRect(i + p, x, 20, 20)
							i -= 20;
							cerise += 1;
						} else {
							ctx.fillStyle = "#034406";
							ctx.fillRect(i + p, x, 20, 20)
							i -= 20;
						}
					}

					x += 15;
				}

				for(let i = f + 20; i < 5.5 * 40 + 1; i += 40){
					if(random(12) == 3 && cerise < 3){
						ctx.fillStyle = "red";
						ctx.fillRect(i + p, x, 20, 20)
						i -= 20;
						cerise += 1;
					} else {
						ctx.fillStyle = "#034406";
						ctx.fillRect(i + p, x, 20, 20)
						i -= 20;
					}
				}

				x += 15;

				for(let i = f + 40; i < 5 * 40 + 1; i += 40){
					ctx.fillStyle = "#034406";
					ctx.fillRect(i + p, x, 20, 20)
					i -= 20;
				}
			}

			function draw_path(){
				let colors = ["grey", "#B68A49", "#544021"];
				let m = 0;

				for(let i = 0; i < window.innerWidth; i += 40){
					ctx.fillStyle = colors[2];
					ctx.fillRect(i, window.innerHeight / 2, 20, 20);
					i -= 20;
					if(random(25) == 1){
						ctx.fillStyle = colors[random(2 + 1)];
						ctx.fillRect(i, window.innerHeight / 2, 20, 20);
					}
				}
				for(let t = 0; t < 8; t++){
					for(let o = 0; o < window.innerWidth; o += 40){
						let op = 1;

						if(random(70) == 2){
							op = 0;
						} else if(random(70) == 3){
							op = 2;
						}
						
						ctx.fillStyle = colors[op];
						ctx.fillRect(o, window.innerHeight / 2 + 20 + (t * 15), 20, 20);
						m = window.innerHeight / 2 + 20 + (t * 15)
						o -= 20;
					}
				}
				for(let i = 0; i < window.innerWidth; i += 40){
					ctx.fillStyle = colors[2];
					ctx.fillRect(i, m + 20, 20, 20);
					i -= 20;
					if(random(25) == 1){
						ctx.fillStyle = colors[random(2 + 1)];
						ctx.fillRect(i, m + 20, 20, 20);
					}
				}
			}

			function draw_water(p, v, size){
				m = p;
				for(let x = 0; x < (size / 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + v, m, 20, 20);
				}
				m += 20;
				for(let x = 0; x < ((size / 2) + 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + (v - 20), m, 20, 20);
				}
				m += 20;
				for(let x = 0; x < (size - 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + (v - 20), m, 20, 20);
				}
			}

			function main(){

				get_sol();
				draw_path();

				let w = 0;
				for(let y = 0; y < random(4) + 1; y++){
					if(w == 4) break;
					drawTree(random(window.innerWidth));
					w += 1;
				}
				//draw_water(random(window.innerHeight), random(window.innerWidth), random(10));
			}

			main();

		</script>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				overflow: hidden; /* optionnel, enlève les scrollbars */
			}

			#canva {
				display: block; /* évite le petit espace sous le canvas */
			}

			#canva {
				margin-top: 0px;
				margin-left: 0px;
			}
			#refresh {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 10;
			}
			canvas { image-rendering: pixelated; }
		</style>
	</body>	
</html>
