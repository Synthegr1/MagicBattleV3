<html>
	<head>
		<title>Chaque Jours</title>
	</head>
	<body>
		<canvas id="canva" width="7920" height="100">Test</canvas>
		<button id="refresh" onclick="main()">Refresh</button>
		<button class="test" onclick="showMatrice()">Show Matrice</button>
		<button class="rend" onclick="render()">Render</button>
		<button class="chunk" onclick="showChunk()">Show Coordinates</button>

		<script>
			const matric = [];
			const matricUniverselle = [];

			let player_x = 100;
			let player_y = 100;
			let chunk_x = 0;
			let chunk_y = 0;

			myAudioElement = new Audio("piafs.mp3");
			myMainAudio = new Audio("main.ogg");

			var js_canva = document.getElementById("canva");
			js_canva.width = window.innerWidth;
			js_canva.height = window.innerHeight;

			console.log(window.innerHeight);

			var ctx = canva.getContext("2d");

			move(12);

			ctx.fillStyle = "#108C07";

			document.getElementById("refresh").addEventListener("click", () => {
				myAudioElement.play();
				myMainAudio.play();
				main();
			});

			document.addEventListener("keydown", logKey);


			//-- Push dans la matrice --//

			function matricPush(x, y, color){
				console.log("Matrice Push");

				matric.push(x);
				matric.push(y);
				matric.push(color);	
			}


			//-- Fonction afficher la Matrice --//

			function render(){
				let x;
				let y;
				let color;

				for(let i = 0; i < matric.length; i += 3){
					console.log("RENDER")

					x = matric[i];
					y = matric[i + 1];
					color = matric[i + 2];

					ctx.fillStyle = color;
					ctx.fillRect(x, y, 20, 20);
				}

				//move();
			}


			//-- Touches clavier --//

			function logKey(e) {
				//console.log(e.code);
				let f;

				if(player_x > window.innerWidth - 20){
					//alert("Out 1");
					player_x = 100;
					chunk_x += 1;
					main();
				}else if(player_x < 20){
					player_x = window.innerWidth - 100;
					main();
					chunk_x += -1;
				}
				else if(player_y < 20){
					chunk_y += 1;
					player_y = window.innerHeight - 100;
					main();
				}else if(player_y > window.innerHeight - 20){
					chunk_y -= 1;
					player_y = 100;
					main();
				}else{
					if(e.code == "ArrowUp"){
						player_y -= 20;
						f = 3;
					}else if(e.code == "ArrowDown"){
						player_y += 20;
						f = 0;
					}else if(e.code == "ArrowRight"){
						player_x += 20;
						f = 1;
					}else if(e.code == "ArrowLeft"){
						player_x -= 20;
						f = 4;
					} 
				}

				render();
				move();

			}



			function showChunk(){
				window.alert("Chunk X = " + chunk_x + "\n" + "Chunk Y = " + chunk_y + "\n\n" + "Player X = " + player_x + "\n" + "Player Y = " + player_y);
			}




			//-- Random tt ce kya de plus normal --//

			function random(max) {
  				return Math.floor(Math.random() * max);
			}


			//-- Déplacer le pixel du joueur --//

			function move(){
				ctx.fillStyle = "yellow";
				ctx.fillRect(player_x, player_y, 20, 20);
			}


			//-- Génération du sol --//

			function get_sol(){
				let cerise = 0;
				let number = 0;
				let size = window.innerWidth;
				m = 35;
				//console.log(size);
				for(let f = 0; f < window.innerHeight; f += 20){
					for(let i = 0; i < size; i += 20){
						ctx.fillStyle = "#108C07";
						ctx.fillRect(i, f, 20, 20);

						matricPush(i, f, "#108C07");

						//console.log(i);
					}
					let colors = ["#14920B", "#0B7A04"];
					let b = false;

					if(random(10) == 1 && number < m){
						let k = random(2);
						let h = random(size);

						ctx.fillStyle = colors[k];
						ctx.fillRect(h, f, 20, 20)

						matricPush(h, f, colors[k]);

						b = true;
						number += 1;
					} else {
						continue;
					}

					if(b && random(12) == 2 && number < m){
						let k = random(size);

						ctx.fillStyle = "#0C6F05";
						ctx.fillRect(k, f, 20, 20)
						number += 1;

						matricPush(k, f, "#0C6F05");

					} else {
						continue;
					}

					if(random(5) == 4){
						let Florian = "grey"

						let k = random(size);

						ctx.fillStyle = Florian;
						ctx.fillRect(k, f, 20, 20)

						matricPush(k, f, Florian);

					}
					 else if(random(12) == 4){
						let k = random(size);

						ctx.fillStyle = "#544021";
						ctx.fillRect(k, f, 20, 20)

						matricPush(k, f, "#544021");

					}
				}
			}


			//-- Génération des arbres --//

			function drawTree(p){
				let n = random(window.innerHeight - 200);

				let cerise = 0;
				let f = 100;
				let x = n;

				for(let i = f + 40; i < 5 * 40 + 1; i += 20){
					ctx.fillStyle = "#034406";
					ctx.fillRect(i + p, x, 20, 20);
					matricPush(i + p, x, "#034406");
				}

				x += 20;

				for(let i = f + 20; i < 5.5 * 40 + 1; i += 20){ //LA
					if(random(12) == 3 && cerise < 3){
						ctx.fillStyle = "red";
						ctx.fillRect(i + p, x, 20, 20);
						matricPush(i + p, x, "red");
						cerise += 1;
					} else {
						ctx.fillStyle = "#034406";
						ctx.fillRect(i + p, x, 20, 20);
						matricPush(i + p, x, "#034406");
					}
				}

				x += 20;

				for(let o = 0; o < 4; o++){
					for(let i = f; i < 6 * 40 + 1; i += 20){ //LA
						if(random(12) == 3 && cerise < 3){
							ctx.fillStyle = "red";
							ctx.fillRect(i + p, x, 20, 20)
							matricPush(i + p, x, "red");
							cerise += 1;
						} else {
							ctx.fillStyle = "#034406";
							ctx.fillRect(i + p, x, 20, 20)
							matricPush(i + p, x, "#034406");
						}
					}

					x += 20;
					
				}

				

				for(let i = f + 20; i < 5.5 * 40 + 1; i += 20){
					if(random(12) == 3 && cerise < 3){
						ctx.fillStyle = "red";
						ctx.fillRect(i + p, x, 20, 20)
						matricPush(i + p, x, "red");
						cerise += 1;
					} else {
						ctx.fillStyle = "#034406";
						ctx.fillRect(i + p, x, 20, 20)
						matricPush(i + p, x, "#034406");
					}
				}

				x += 20;

				for(let i = f + 40; i < 5 * 40 + 1; i += 20){
					ctx.fillStyle = "#034406";
					ctx.fillRect(i + p, x, 20, 20)
					matricPush(i + p, x, "#034406");
				}
			}


			//-- Génération du chemin --//

			function draw_path(){
				let colors = ["grey", "#B68A49", "#544021"];
				let m = 0;

				for(let i = 0; i < window.innerWidth; i += 20){
					ctx.fillStyle = colors[2];
					ctx.fillRect(i, window.innerHeight / 2, 20, 20);

					matricPush(i, window.innerHeight / 2, colors[2]);

					if(random(100) == 1){
						let k = random(2 + 1);

						ctx.fillStyle = colors[k];
						ctx.fillRect(i, window.innerHeight / 2, 20, 20);

						matricPush(i, window.innerHeight / 2, colors[k]);
					}
				}
				for(let t = 0; t < 8; t++){
					for(let o = 0; o < window.innerWidth; o += 20){
						let op = 1;

						if(random(100) == 2){
							op = 0;
						} else if(random(100) == 3){
							op = 2;
						}
						
						ctx.fillStyle = colors[op];
						ctx.fillRect(o, window.innerHeight / 2 + 20 + (t * 15), 20, 20);

						matricPush(o, window.innerHeight / 2 + 20 + (t * 15), colors[op]);

						m = window.innerHeight / 2 + 20 + (t * 15)
					}
				}
				for(let i = 0; i < window.innerWidth; i += 20){
					ctx.fillStyle = colors[2];
					ctx.fillRect(i, m + 20, 20, 20);
					matricPush(i, m + 20, colors[2]);
					if(random(100) == 1){
						let k = random(2 + 1);

						ctx.fillStyle = colors[k];
						ctx.fillRect(i, m + 20, 20, 20);
						matricPush(i, m + 20, colors[k]);
					}
				}
			}


			//-- Génération des flaques d'eau --//

			function draw_water(p, v, size){
				m = p;
				for(let x = 0; x < (size / 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + v, m, 20, 20);
				}
				m += 20;
				for(let x = 0; x < ((size / 2) + 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + (v - 20), m, 20, 20);
				}
				m += 20;
				for(let x = 0; x < (size - 2) * 20; x += 20){
					ctx.fillStyle = "blue";
					ctx.fillRect(x + (v - 20), m, 20, 20);
				}
			}


			//-- Afficher la Matrice dans un window alert --//

			function showMatrice(){
				window.alert(matric);
			}



			//-- Fonction principale (main()) --//

			function main(){
				matric.length = 0;
				get_sol();
				if(chunk_y == 0){
					draw_path();
				}
				let w = 0;
				for(let y = 0; y < random(4) + 1; y++){
					if(w == 4) break;
					drawTree(random(window.innerWidth - 200));
					w += 1;
				}
				//draw_water(random(window.innerHeight), random(window.innerWidth), random(10));

				//window.alert(matric);
			}


			main();

		</script>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				overflow: hidden; /* optionnel, enlève les scrollbars */
			}

			#canva {
				display: block; /* évite le petit espace sous le canvas */
			}

			#canva {
				margin-top: 0px;
				margin-left: 0px;
			}
			#refresh {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 10;
				color: yellow;
				background-color: white;
			}
			.test{
				position: absolute;
				top: 10px;
				left: 75px;
				z-index: 10;
				color: red;
				background-color: white;
			}
			.rend{
				position: absolute;
				top: 10px;
				left: 175px;
				z-index: 10;
				color: blue;
				background-color: white;
			}
			.chunk{
				position: absolute;
				top: 10px;
				left: 235px;
				z-index: 10;
				color: orange;
				background-color: white;
			}
			canvas { image-rendering: pixelated; }
		</style>
	</body>	
</html>
